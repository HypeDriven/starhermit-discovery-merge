<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png" type="image/png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1712">
<title>Discovery Merge</title>
<meta name="description" content="Combine identical objects to unlock a branching discovery chain and restore themed scenes.">
<link rel="stylesheet" href="css/style.css?v=production-qa-2">
<script src="sh-language.js"></script>
<script src="game-options.js" data-game="discovery-merge"></script>
<script src="ui-scale.js"></script>
<script src="browser-guard.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🧭</span>
      <h1>Discovery Merge</h1>
    </div>
    <div id="topbar-status" role="status"></div>
    <nav class="topbar-actions" aria-label="Global" data-i18n-aria="Global">
      <button id="btn-help" class="ghost" data-i18n="Help">Help</button>
      <button id="btn-codex" class="ghost" data-i18n="Codex">Codex</button>
      <button id="btn-settings" class="ghost" data-i18n="Settings">Settings</button>
    </nav>
  </header>

  <main id="screens">
    <section id="screen-title" class="screen" aria-labelledby="title-h">
      <h2 id="title-h" class="sr-only" data-i18n="Discovery Merge — home">Discovery Merge — home</h2>
      <div class="title-hero" aria-hidden="true">
        <img id="title-art" src="assets/key-art.webp" alt="" decoding="async" onerror="this.parentNode.classList.add('no-art')">
        <span class="title-glyphs">🧭🗺️🌿</span>
      </div>
      <p class="tagline" data-i18n="Restore the explorer’s cabinet, one merge at a time.">Restore the explorer’s cabinet, one merge at a time.</p>
      <button id="btn-play" class="primary big" data-i18n="Play">Play</button>
      <div class="title-secondary">
        <button id="btn-daily" class="card-btn">
          <strong data-i18n="Daily Cabinet">Daily Cabinet</strong><span id="daily-sub">One shared seed per UTC day</span>
        </button>
        <button id="btn-journey" class="card-btn">
          <strong data-i18n="Journey">Journey</strong><span id="journey-sub">40 stages · 5 scenes</span>
        </button>
        <button id="btn-profile" class="card-btn">
          <strong data-i18n="Curator Profile">Curator Profile</strong><span id="profile-sub">Guest</span>
        </button>
      </div>
      <div id="title-platform" class="title-platform" hidden>
        <button id="btn-signin" class="card-btn" hidden><strong id="btn-signin-label" data-i18n="Sign in with StarHermit">Sign in with StarHermit</strong></button>
        <button id="btn-invite" class="card-btn" hidden><strong id="btn-invite-label" data-i18n="Invite a friend">Invite a friend</strong></button>
      </div>
      <p id="resume-note" class="resume-note" hidden>
        <button id="btn-resume" class="primary" data-i18n="Resume paused board">Resume paused board</button>
      </p>
    </section>

    <section id="screen-modes" class="screen" aria-labelledby="modes-h" hidden>
      <h2 id="modes-h" data-i18n="Choose a mode">Choose a mode</h2>
      <div class="mode-grid">
        <button class="card-btn" data-mode="learn"><strong data-i18n="Learn">Learn</strong><span data-i18n="Interactive lessons — one rule at a time">Interactive lessons — one rule at a time</span></button>
        <button class="card-btn" data-mode="journey"><strong data-i18n="Journey">Journey</strong><span data-i18n="Authored stages with mastery tests · ranked">Authored stages with mastery tests · ranked</span></button>
        <button class="card-btn" data-mode="daily"><strong data-i18n="Daily">Daily</strong><span data-i18n="Shared seed per UTC day · ranked">Shared seed per UTC day · ranked</span></button>
        <button class="card-btn" data-mode="practice"><strong data-i18n="Practice">Practice</strong><span data-i18n="Your difficulty, undo allowed · unranked">Your difficulty, undo allowed · unranked</span></button>
        <button class="card-btn" data-mode="challenge"><strong data-i18n="Challenge">Challenge</strong><span data-i18n="Move limits, speed targets, dense boards · ranked">Move limits, speed targets, dense boards · ranked</span></button>
        <button class="card-btn" data-mode="scores"><strong data-i18n="Score Chase">Score Chase</strong><span data-i18n="Leaderboards & shareable seeds">Leaderboards &amp; shareable seeds</span></button>
      </div>
      <button class="ghost back" data-back data-i18n="Back">Back</button>
    </section>

    <section id="screen-journey" class="screen" aria-labelledby="journey-h" hidden>
      <h2 id="journey-h" data-i18n="Journey">Journey</h2>
      <p class="screen-sub" id="journey-progress-sub"></p>
      <div id="journey-list" class="journey-list"></div>
      <button class="ghost back" data-back data-i18n="Back">Back</button>
    </section>

    <section id="screen-setup" class="screen" aria-labelledby="setup-h" hidden>
      <h2 id="setup-h" data-i18n="Set up">Set up</h2>
      <div id="setup-body" class="setup-body"></div>
      <button class="ghost back" data-back data-i18n="Back">Back</button>
    </section>

    <section id="screen-play" class="screen play" aria-labelledby="play-h" hidden>
      <h2 id="play-h" class="sr-only" data-i18n="Board">Board</h2>
      <div id="play-wrap">
        <aside id="rail-left" aria-label="Objectives" data-i18n-aria="Objectives">
          <h3 data-i18n="Requests">Requests</h3>
          <div id="requests"></div>
          <div id="tutorial-panel" hidden>
            <p id="tutorial-text"></p>
            <button id="tutorial-finish" class="primary" hidden data-i18n="Finish lesson">Finish lesson</button>
          </div>
        </aside>
        <div id="board-region">
          <div id="gl-container" aria-hidden="true"></div>
          <div id="dom-board" role="grid" aria-label="Merge board" data-i18n-aria="Merge board"></div>
          <div id="countdown" hidden aria-hidden="true"></div>
        </div>
        <aside id="rail-right" aria-label="Status and actions" data-i18n-aria="Status and actions">
          <div id="score-panel"></div>
          <div id="moves-panel"></div>
          <div id="timer-panel"></div>
          <div class="action-col">
            <button id="btn-pause" class="ghost" data-i18n="Pause">Pause</button>
            <button id="btn-undo" class="ghost" hidden data-i18n="Undo">Undo</button>
            <button id="btn-hint" class="ghost" data-i18n="Hint">Hint</button>
            <button id="btn-camera" class="ghost" data-i18n="Reset camera">Reset camera</button>
          </div>
        </aside>
      </div>
      <div id="mobile-tray">
        <button id="btn-pause-m" class="ghost" data-i18n="Pause">Pause</button>
        <button id="btn-undo-m" class="ghost" hidden data-i18n="Undo">Undo</button>
        <button id="btn-hint-m" class="ghost" data-i18n="Hint">Hint</button>
        <button id="btn-objectives-m" class="ghost" data-i18n="Requests">Requests</button>
        <button id="btn-score-m" class="ghost" data-i18n="Score">Score</button>
      </div>
    </section>

    <section id="screen-results" class="screen" aria-labelledby="results-h" hidden>
      <h2 id="results-h" data-i18n="Results">Results</h2>
      <div id="results-body"></div>
      <div class="results-actions">
        <button id="btn-retry" class="primary" data-i18n="Retry">Retry</button>
        <button id="btn-next" class="primary" data-i18n="Next stage">Next stage</button>
        <button id="btn-results-home" class="ghost" data-i18n="Home">Home</button>
      </div>
    </section>
  </main>

  <div id="overlay-root"></div>
  <div id="toast-root"></div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <div id="live-assertive" class="sr-only" aria-live="assertive"></div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script src="gpu-level.js"></script>
<script src="starhermit-sdk.js"></script>
<script type="module" src="src/main.js?v=production-qa-2"></script>
</body>
</html>
